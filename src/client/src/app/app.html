<mat-toolbar class="toolbar">
  <a routerLink="/" class="brand">Stack Track</a>
  <span class="spacer"></span>
  @if (isAdmin()) {
    <a mat-button routerLink="/admin/users">Admin</a>
  }
  @if (user(); as user) {
    <span class="user">
      <span class="avatar" aria-hidden="true">{{ user.displayName.charAt(0).toUpperCase() }}</span>
      {{ user.displayName }}
    </span>
    <button mat-button class="sign-out" type="button" (click)="signOut()">Sign out</button>
  } @else {
    <a mat-button routerLink="/auth/sign-in">Sign in</a>
  }
</mat-toolbar>
<main><router-outlet /></main>
