<mat-toolbar class="toolbar">
  <a routerLink="/" class="brand">Stack Track</a>
  <span class="spacer"></span>
  @if (isAdmin()) {
    <a mat-button routerLink="/admin/users">Admin</a>
  }
  @if (user(); as user) {
    <button mat-button type="button" class="user" [matMenuTriggerFor]="menu">
      <span class="avatar" aria-hidden="true">{{ user.displayName.charAt(0).toUpperCase() }}</span>
      {{ user.displayName }}
    </button>
    <mat-menu #menu="matMenu">
      <button mat-menu-item type="button" class="sign-out" (click)="signOut()">Sign out</button>
    </mat-menu>
  } @else {
    <a mat-button routerLink="/auth/sign-in">Sign in</a>
  }
</mat-toolbar>
<main><router-outlet /></main>
