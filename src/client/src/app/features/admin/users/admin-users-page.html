<h1>Users</h1>

<input type="search" placeholder="Search by name or email" aria-label="Search users" (input)="onSearch($any($event.target).value)" />

<table mat-table matSort matSortActive="name" matSortDirection="asc" [dataSource]="data().items" (matSortChange)="onSort($event)">
  <ng-container matColumnDef="name">
    <th mat-header-cell mat-sort-header="name" *matHeaderCellDef>Name</th>
    <td mat-cell *matCellDef="let u">{{ u.displayName }}</td>
  </ng-container>
  <ng-container matColumnDef="email">
    <th mat-header-cell *matHeaderCellDef>Email</th>
    <td mat-cell *matCellDef="let u">{{ u.email }}</td>
  </ng-container>
  <ng-container matColumnDef="role">
    <th mat-header-cell *matHeaderCellDef>Role</th>
    <td mat-cell *matCellDef="let u">
      <select [attr.aria-label]="'Role for ' + u.displayName" [disabled]="isOwn(u)" (change)="changeRole(u, $any($event.target).value)">
        <option value="Member" [selected]="u.role === 'Member'">Member</option>
        <option value="Admin" [selected]="u.role === 'Admin'">Admin</option>
      </select>
    </td>
  </ng-container>
  <ng-container matColumnDef="status">
    <th mat-header-cell *matHeaderCellDef>Status</th>
    <td mat-cell *matCellDef="let u">{{ u.isActive ? 'Active' : 'Deactivated' }}</td>
  </ng-container>
  <ng-container matColumnDef="created">
    <th mat-header-cell mat-sort-header="created" *matHeaderCellDef>Created</th>
    <td mat-cell *matCellDef="let u">{{ u.createdAt | date: 'mediumDate' }}</td>
  </ng-container>
  <ng-container matColumnDef="actions">
    <th mat-header-cell *matHeaderCellDef><span class="sr-only">Actions</span></th>
    <td mat-cell *matCellDef="let u">
      @if (u.isActive) {
        <button matButton [disabled]="isOwn(u)" (click)="deactivate(u)">Deactivate</button>
      } @else {
        <button matButton (click)="reactivate(u)">Reactivate</button>
      }
    </td>
  </ng-container>

  <tr mat-header-row *matHeaderRowDef="columns"></tr>
  <tr mat-row *matRowDef="let row; columns: columns"></tr>
</table>

<mat-paginator
  [length]="data().totalCount"
  [pageSize]="20"
  [pageIndex]="data().page - 1"
  [hidePageSize]="true"
  (page)="onPage($event)"
/>
