<section class="stage">
  <form class="card" [formGroup]="form" (ngSubmit)="submit()" novalidate>
    <h1>Welcome back</h1>
    <p class="sub">Sign in to get back to your boards.</p>

    @if (error(); as message) {
      <div class="banner" role="alert">{{ message }}</div>
    }

    <mat-form-field appearance="fill">
      <mat-label>Email</mat-label>
      <input matInput id="email" type="email" formControlName="email" autocomplete="email" />
      @if (form.controls.email.invalid) {
        <mat-error>Enter your email</mat-error>
      }
    </mat-form-field>

    <mat-form-field appearance="fill">
      <mat-label>Password</mat-label>
      <input
        matInput
        id="password"
        type="password"
        formControlName="password"
        autocomplete="current-password"
      />
      @if (form.controls.password.invalid) {
        <mat-error>Enter your password</mat-error>
      }
    </mat-form-field>

    <button mat-flat-button type="submit" [disabled]="pending()">Sign in</button>
    <p class="alt">New here? <a routerLink="/auth/sign-up">Create an account</a></p>
  </form>
</section>
